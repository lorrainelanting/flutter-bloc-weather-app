name: generic_app_workspace
publish_to: 'none'

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # ── Canonical versions for packages shared by 2+ workspace members ────
  # Members restate these constraints verbatim. Pub does not enforce the
  # match, but the workspace resolver errors on genuine incompatibility and
  # the committed root pubspec.lock records the single resolved version.
  # Bump here first, then update the members listed in the comment.
  firebase_core: ^3.0.0      # app
  firebase_auth: ^5.0.0      # app, feature/auth
  google_sign_in: ^6.2.1     # app, feature/auth
  generic_app:
    path: app

workspace:
  - app
  - core
  - feature/auth
  - feature/home
  - feature/weather

flutter:
  uses-material-design: true
  assets:
    - app/assets/.env
